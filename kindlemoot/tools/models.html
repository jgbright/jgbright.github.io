<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kindlemoot model preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0f1a; color: #e8e4da; font: 14px/1.4 ui-sans-serif, system-ui, "Segoe UI", sans-serif; overflow: hidden; }
  canvas { display: block; }
  #help { position: fixed; left: 12px; top: 10px; background: #0008; padding: 8px 12px; border-radius: 8px; max-width: 30rem; }
  #help b { color: #ffcf3f; }
</style>
<script type="importmap">
{ "imports": { "three": "../vendor/three/build/three.module.js", "three/addons/": "../vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="help">
  <b>Kindlemoot model preview.</b> Keys: <b>1</b> to <b>6</b> show a hero's first-person weapon, <b>0</b> goes back to the row.
  <b>T</b> swaps team colours. <b>O</b> fades the figures. <b>F</b> fires. <b>C</b> plays a cast flourish. <b>R</b> reloads. <b>Z</b> zooms. <b>Space</b> stops the spin.
  <div id="info"></div>
</div>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { HEROES, HERO_IDS, TEAMS } from '../js/data/heroes.js';
import { buildHero, buildViewModel } from '../js/render/heromodels.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;      // three r187 has no PCFSoftShadowMap
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#141a2e');
scene.fog = new THREE.FogExp2('#141a2e', 0.018);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 200);
scene.add(camera);

scene.add(new THREE.HemisphereLight('#8fa3d9', '#3a2c22', 1.1));
const key = new THREE.DirectionalLight('#ffd9a8', 3.2);
key.position.set(-5, 9, -8);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -9, right: 9, top: 6, bottom: -4, near: 1, far: 30 });
key.shadow.bias = -0.0005;
scene.add(key);
const rim = new THREE.DirectionalLight('#7f8cff', 1.2);
rim.position.set(6, 5, 8);
scene.add(rim);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: '#3b3a41', roughness: 0.9 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.5, 0.9));
composer.addPass(new OutputPass());

const state = { team: 0, opacity: 1, spin: true, fire: false, view: -1, zoom: 0, zoomWant: 0, reloadAt: -1, walkOverride: null };
let heroes = [], vm = null;

function buildRow() {
  for (const h of heroes) h.model.dispose();
  heroes = HERO_IDS.map((id, i) => {
    const model = buildHero(id, TEAMS[(state.team + (i % 2)) % 2].color);
    model.group.position.set((i - 2.5) * 1.75, 0, 0);
    scene.add(model.group);
    return { id, model, spin: 0 };
  });
  document.getElementById('info').textContent = heroes.map((h) => `${h.id}: ${h.model.meshCount} meshes`).join(' · ');
}
buildRow();

function setView(i) {
  if (vm) { vm.dispose(); vm = null; }
  state.view = i;
  if (i >= 0) { vm = buildViewModel(HERO_IDS[i]); camera.add(vm.group); }
}

addEventListener('keydown', (e) => {
  if (e.code === 'KeyT') { state.team = 1 - state.team; buildRow(); }
  else if (e.code === 'KeyO') { state.opacity = state.opacity === 1 ? 0.35 : 1; for (const h of heroes) h.model.setOpacity(state.opacity); }
  else if (e.code === 'KeyF') state.fire = !state.fire;
  else if (e.code === 'KeyC') { if (vm) vm.cast(Math.floor(Math.random() * 3)); }
  else if (e.code === 'KeyR') state.reloadAt = performance.now() / 1000;
  else if (e.code === 'KeyZ') state.zoomWant = 1 - state.zoomWant;
  else if (e.code === 'Space') state.spin = !state.spin;
  else if (/^Digit[0-6]$/.test(e.code)) setView(+e.code.slice(5) - 1);
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

// Hooks for scripted checks.
window.preview = {
  state, setView, heroes: () => heroes, vm: () => vm,
  setSpin(angle) { state.spin = false; for (const h of heroes) h.spin = angle; },
  setOpacity(a) { state.opacity = a; for (const h of heroes) h.model.setOpacity(a); },
  renderer,
};

const hs = { speed: 0, onGround: true, pitch: 0, firing: false, time: 0, ult: false };
const vs = { speed: 0, onGround: true, firing: false, time: 0, zoom: 0, reload: 0, flaming: false };
let last = performance.now() / 1000, shotAt = 0;

renderer.setAnimationLoop(() => {
  const now = performance.now() / 1000, dt = Math.min(0.05, now - last);
  last = now;
  const walking = state.walkOverride !== null ? state.walkOverride : Math.floor(now / 3.5) % 2 === 0;
  const jump = Math.floor(now / 3.5) % 4 === 3 && now % 3.5 < 0.5;
  const shoot = state.fire && now - shotAt > 0.22;
  if (shoot) shotAt = now;
  heroes.forEach((h, i) => {
    if (state.spin) h.spin += dt * 0.5;
    h.model.group.rotation.y = h.spin;                // heroes face -Z, toward the camera, at spin 0
    hs.speed = walking ? HEROES[h.id].speed : 0;
    hs.onGround = !jump;
    hs.pitch = Math.sin(now * 0.7 + i) * 0.35;
    hs.firing = state.fire; hs.time = now; hs.ult = false;
    h.model.group.position.y = jump ? Math.sin(((now % 3.5) / 0.5) * Math.PI) * 0.5 : 0;
    h.model.update(dt, hs);
    if (shoot) h.model.kick();
  });
  if (state.view >= 0) {
    camera.fov = 78 - state.zoom * 40; camera.updateProjectionMatrix();
    camera.position.set(0, 1.65, -7.5);
    camera.lookAt(0, 1.2, 0);
  } else {
    camera.fov = 42; camera.updateProjectionMatrix();
    // Stand far enough back to fit the whole row at this window shape.
    const dist = Math.max(6, 5.6 / (Math.tan((21 * Math.PI) / 180) * camera.aspect));
    camera.position.set(0, 1.9, -dist);
    camera.lookAt(0, 1.0, 0);
  }
  if (vm) {
    state.zoom += (state.zoomWant - state.zoom) * Math.min(1, dt * 12);
    const id = HERO_IDS[state.view], reload = HEROES[id].weapon.reload;
    const rt = state.reloadAt >= 0 ? (now - state.reloadAt) / reload : 0;
    if (rt >= 1) state.reloadAt = -1;
    vs.speed = walking ? 6 : 0; vs.onGround = !jump; vs.firing = state.fire; vs.flaming = state.fire;
    vs.time = now; vs.zoom = state.zoom; vs.reload = rt > 0 && rt < 1 ? rt : 0;
    vm.update(dt, vs);
    if (shoot) vm.kick();
  }
  composer.render();
});
</script>
</body>
</html>
